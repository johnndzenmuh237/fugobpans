<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Tracking Lookup | FUGOBPANS</title>
<meta name="description" content="Teachers, workers and staff can check salary, attendance and leave status using their tracking code." />
<link rel="canonical" href="https://fugobpans.example/track-staff.html" />
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/responsive.css" />
<script src="/assets/js/config.js"></script>
</head>
<body>
<div id="siteHeader"></div>

<section class="section">
  <div class="container" style="max-width:640px;">
    <div class="section-head">
      <h1>Staff Tracking Lookup</h1>
      <p>For teachers, workers, and every staff member — enter your tracking code to check your salary status, attendance, and leave requests. No login needed. This code is private to you.</p>
    </div>

    <form id="lookupForm" class="card card-pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
      <div class="field" style="flex:1;min-width:220px;">
        <label>Tracking Code</label>
        <input id="codeInput" required placeholder="e.g. 7K4M9P2QR" style="text-transform:uppercase;" />
      </div>
      <button type="submit" class="btn btn-accent">Look Up</button>
    </form>

    <div id="resultMount" style="margin-top:24px;"></div>
  </div>
</section>

<div id="siteFooter"></div>
<script type="module" src="/assets/js/public-layout.js"></script>
<script type="module" src="/assets/js/track-staff.js"></script>
</body>
</html>
