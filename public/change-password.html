<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
<title>Change Password | FUGOBPANS</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/responsive.css" />
<script src="/assets/js/config.js"></script>
<style>.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth-box{width:100%;max-width:420px}</style>
</head>
<body>
<div class="auth-shell"><div class="auth-box">
<h1>Change your password</h1>
<p class="text-muted" id="changeNote">Choose a new password of at least 8 characters.</p>
<form id="changeForm" class="card card-pad" style="margin-top:16px;">
  <div class="field" id="currentField"><label>Current password</label><input name="currentPassword" type="password" autocomplete="current-password" /></div>
  <div class="field"><label>New password</label><input name="newPassword" type="password" minlength="8" autocomplete="new-password" required /></div>
  <div class="field"><label>Confirm new password</label><input name="confirm" type="password" minlength="8" autocomplete="new-password" required /></div>
  <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
</form>
<p style="margin-top:12px;"><a href="#" id="backLink" class="text-muted">&larr; Back</a></p>
</div></div>
<script type="module" src="/assets/js/auth-pages.js"></script>
</body>
</html>
