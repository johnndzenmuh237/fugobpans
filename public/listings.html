 <button class="chip is-active" data-kind="">All</button><button class="chip" data-kind="HOUSE"> Houses</button><button class="chip" data-kind="ESTATE"> Estates &amp; apartments</button><button class="chip" data-kind="LAND"> Land</button><button class="chip" data-kind="COMMERCIAL"> Commercial</button></div>

<select id="fPurpose"><option value="">Rent or sale</option><option value="RENT">For rent</option><option value="SALE">For sale</option></select>
<input id="fCity" type="search" placeholder="City or area" /><input id="fQ" type="search" placeholder="Search…" /></div>
<div id="grid"><div class="spinner"></div></div></div></section>
<div id="siteFooter"></div>
