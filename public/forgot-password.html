<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
<title>Forgot Password | FUGOBPANS</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/responsive.css" />
<script src="/assets/js/config.js"></script>
<style>.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth-box{width:100%;max-width:420px}</style>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#12203d" />
<meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-title" content="FUGOBPANS" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
</head>
<body>
<div class="auth-shell"><div class="auth-box">
<a href="/login.html" class="text-muted" style="font-size:.85rem;">&larr; Back to login</a>
<h1 style="margin-top:14px;">Reset your password</h1>
<p class="text-muted">Enter your account email. If it matches an account we will send a reset link that works once for 30 minutes.</p>
<form id="forgotForm" class="card card-pad" style="margin-top:16px;">
  <div class="field"><label>Email</label><input name="email" type="email" required /></div>
  <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
  <p id="doneMsg" class="text-muted" style="margin-top:12px;display:none;"></p>
</form>
</div></div>
<script type="module" src="/assets/js/auth-pages.js"></script>
<script type="module" src="/assets/js/icons.js"></script>
<script type="module" src="/assets/js/pwa.js"></script>
</body>
</html>
