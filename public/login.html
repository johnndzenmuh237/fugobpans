<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
<title>Staff Login | FUGOBPANS</title>
<meta name="description" content="Secure staff, teacher, employee, and student portal login for FUGOBPANS." />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/responsive.css" />
<script src="/assets/js/config.js"></script>
<style>
  .auth-shell { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .auth-box { width:100%; max-width:400px; }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-box">
    <a href="/index.html" class="text-muted" style="font-size:.85rem;">&larr; Back to website</a>
    <h1 style="margin-top:14px;">Staff Login</h1>
    <p class="text-muted">Manager, Accountant, Teacher and Employee logins all sign in here.</p>
    <form id="loginForm" class="card card-pad" style="margin-top:16px;">
      <div class="field"><label>Email</label><input name="email" type="email" required /></div>
      <div class="field"><label>Password</label><input name="password" type="password" required /></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>
  </div>
</div>
<script type="module" src="/assets/js/public-login.js"></script>
</body>
</html>
