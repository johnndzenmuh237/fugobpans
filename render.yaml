# Render Blueprint — API server. The database lives on Neon, the website on Firebase Hosting.
services:
  - type: web
    name: fugobpans-api
    runtime: node
    plan: starter            # "free" sleeps after ~15 min idle; use "starter" for a service that never sleeps
    buildCommand: npm ci --omit=dev
    startCommand: npm run upgrade-db && npm start   # applies new migrations safely on each deploy, then starts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon connection string (see docs/DEPLOYMENT-render-neon-firebase.md)
        sync: false
      - key: JWT_SECRET
        generateValue: true        # Render generates a long random secret
      - key: CLIENT_ORIGIN         # your Firebase site(s), comma separated, no trailing slash
        sync: false
      - key: DATABASE_SSL
        value: "true"

  # Daily fee reminders (07:00 Douala = 06:00 UTC). Does nothing until the Owner switches reminders on AND a provider is configured.
  - type: cron
    name: fugobpans-reminders
    runtime: node
    schedule: "0 6 * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run send-reminders
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_TOKEN
        sync: false
